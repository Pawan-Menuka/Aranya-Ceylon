services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aranya_integration
      POSTGRES_USER: aranya
      POSTGRES_PASSWORD: aranya_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aranya -d aranya_integration"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
