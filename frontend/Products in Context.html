<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aranya Ceylon — Cards in Context</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="aranya.css" />
<style>
  html, body { margin: 0; background: var(--bg); }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 40px; }
  .feat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 22px; }
  @media (max-width: 1080px){ .feat-grid { grid-template-columns: repeat(2, 1fr); } }
  .sec-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 30px; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 30px; }
  .chip { font-family: var(--font-ui); font-size: 13px; font-weight: 600; color: var(--muted); padding: 8px 15px; border: 1px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; }
  .chip.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .mkt { position: fixed; right: 22px; bottom: 22px; z-index: 90; background: rgba(20,18,16,.88); backdrop-filter: blur(12px);
    border: 1px solid rgba(253,250,245,.16); border-radius: 13px; padding: 8px; display: flex; gap: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
  .mkt b { font-family: var(--font-ui); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgba(253,250,245,.5); display: flex; align-items: center; padding: 0 10px; }
  .mkt button { background: rgba(253,250,245,.06); color: rgba(253,250,245,.85); border: 1px solid rgba(253,250,245,.14); border-radius: 9px; padding: 9px 15px; cursor: pointer; font-family: var(--font-ui); font-size: 13px; font-weight: 700; }
  .mkt button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .mkt button.on.local { background: var(--brand); border-color: var(--brand); }
  .tag { font-family: var(--font-ui); font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #fff; background: var(--ink); padding: 4px 9px; border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="spice-data.js"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="cards.jsx"></script>
<script type="text/babel" src="navbar.jsx"></script>
<script type="text/babel">
const { useState } = React;
function SecHead({ ey, title, link }) {
  return (
    <div className="sec-head">
      <div>
        <div className="eyebrow" style={{ color: "var(--accent)", marginBottom: 10 }}>{ey}</div>
        <h2 className="disp" style={{ fontSize: 40, color: "var(--brand)", margin: 0, lineHeight: 1.04, whiteSpace: "nowrap" }}>{title}</h2>
      </div>
      {link && <a href="Catalog.html" style={{ fontFamily: "var(--font-ui)", fontSize: 13.5, fontWeight: 700, color: "var(--brand)", display: "inline-flex", alignItems: "center", gap: 6, paddingBottom: 6 }}>{link} <Icon name="chevron" size={14} stroke="var(--brand)" /></a>}
    </div>
  );
}
function App() {
  const [market, setMarket] = useState("intl");
  const all = window.SPICES;
  const featured = [all[0], all[5], all[4]]; // cinnamon, turmeric, pepper
  const cats = ["All Spices", "Whole", "Ground", "Bestsellers", "GI Certified", "Gift Sets"];
  const [cat, setCat] = useState(0);
  return (
    <div className="aranya">
      <AranyaNavbar market={market} heroMode={false} />

      {/* FEATURED — Card B, curated row */}
      <section style={{ paddingTop: 150 }}>
        <div className="wrap">
          <SecHead ey="Editorial · Hand-picked" title="The Featured Harvest" link="View the collection" />
        </div>
        <div className="wrap">
          <div className="feat-grid">
            {featured.map((s) => <CardB key={s.name} spice={s} market={market} />)}
          </div>
        </div>
      </section>

      {/* PRODUCTS — Card C-final, default catalog */}
      <section style={{ padding: "90px 0 120px" }}>
        <div className="wrap">
          <SecHead ey="Shop · All Spices" title="The 2026 Collection" />
          <div className="toolbar">
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
              {cats.map((c, i) => <button key={c} className={"chip" + (i === cat ? " on" : "")} onClick={() => setCat(i)}>{c}</button>)}
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
              <span style={{ fontFamily: "var(--font-ui)", fontSize: 13, color: "var(--muted)" }}>12 spices</span>
              <span style={{ width: 1, height: 16, background: "var(--line)" }} />
              <button style={{ display: "inline-flex", alignItems: "center", gap: 7, background: "#fff", border: "1px solid var(--line)", borderRadius: 8, padding: "8px 13px", fontFamily: "var(--font-ui)", fontSize: 13, fontWeight: 600, color: "var(--ink)", cursor: "pointer" }}>
                Sort: Featured <Icon name="chevron" size={13} />
              </button>
            </div>
          </div>
          <div className="prod-grid">
            {all.map((s) => <CardCFinal key={s.name} spice={s} market={market} />)}
            {all.map((s) => <CardCFinal key={s.name + "2"} spice={s} market={market} />)}
          </div>
        </div>
      </section>

      <div className="mkt">
        <b>Market</b>
        <button className={market === "intl" ? "on" : ""} onClick={() => setMarket("intl")}>International · USD</button>
        <button className={"local " + (market === "local" ? "on" : "")} onClick={() => setMarket("local")}>Sri Lanka · LKR</button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
