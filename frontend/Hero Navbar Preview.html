<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aranya Ceylon — Navbar on Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="aranya.css" />
<style>
  html, body { margin: 0; background: #E7E0D4; }
  .label { max-width: 1280px; margin: 0 auto; padding: 30px 40px 14px; }
  .label .k { font-family: var(--font-ui); font-size: 11px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; color: var(--accent); }
  .label .t { font-family: var(--font-display); font-size: 30px; font-weight: 600; color: var(--brand); margin: 6px 0 4px; }
  .label .d { font-family: var(--font-ui); font-size: 14px; color: var(--muted); max-width: 720px; line-height: 1.55; }
  .opt { border-top: 1px solid #D8D0C2; }
  .opt:first-child { border-top: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="heroes.jsx"></script>
<script type="text/babel">
function Label({ k, t, d }) {
  return <div className="label"><div className="k">{k}</div><div className="t">{t}</div><div className="d">{d}</div></div>;
}
function App() {
  return (
    <div>
      <div className="opt" data-screen-label="Option B">
        <Label k="Option B · Recommended for this hero" t="Glass forest overlay"
          d="The navbar floats directly on the hero — frosted forest-green glass, light text, the spice mandala bleeding up behind it. Most immersive and modern; the hero feels full-bleed and cinematic. This is what Nav B was designed for." />
        <HeroNavB />
      </div>
      <div className="opt" data-screen-label="Option C">
        <Label k="Option C · True to its design" t="Editorial cream bar above the hero"
          d="The cream two-tier bar sits as a solid header, then the hero begins below it. Crisp, gallery-like separation — the brand identity reads instantly in forest-on-cream, and the photography stays untouched. Classic luxury-retail framing." />
        <HeroNavC />
      </div>
      <div className="opt" data-screen-label="Option C inverted">
        <Label k="Option C′ · If you love C but want it floating" t="Editorial bar, inverted to light, overlaid"
          d="Same two-tier editorial structure as C, but recoloured for dark imagery and floated over the hero like B — gold hairline instead of forest. Bridges the two: editorial layout, immersive placement." />
        <HeroNavCInv />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
