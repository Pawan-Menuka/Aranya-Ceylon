name: CI

on:
  push:
    branches: [main, Develop]
  pull_request:
    branches: [main, Develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @aranya/shared build

      - name: Generate Prisma client
        run: pnpm --filter @aranya/backend exec prisma generate

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Validate Prisma schema
        run: pnpm --filter @aranya/backend exec prisma validate

      - name: Security audit
        # Report-only: surfaces advisories without failing CI. Many remaining
        # high/critical findings are transitive deps inside Prisma's own tooling
        # (@prisma/dev, @prisma/config) that we can't patch directly.
        run: pnpm audit --audit-level=high --prod || true

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aranya-next/package-lock.json

      - name: Install dependencies
        working-directory: aranya-next
        run: npm ci

      - name: Type check
        working-directory: aranya-next
        run: npm run typecheck

      - name: Lint
        working-directory: aranya-next
        run: npm run lint

      - name: Build
        working-directory: aranya-next
        run: npm run build

      - name: "Lighthouse CI (perf audit 13)"
        # Report-only for now (assertions are all "warn", plus continue-on-error
        # as a belt-and-braces safety net) — a freshly-added check on a shared
        # GitHub-hosted runner needs a stability track record before it should
        # be able to block unrelated PRs. Thresholds mirror the existing manual
        # target in DEPLOY_READINESS_PLAN.md item 4.7 (Perf >= 70, a11y >= 90,
        # no CLS failures) rather than inventing new numbers.
        working-directory: aranya-next
        continue-on-error: true
        run: npx --yes @lhci/cli@0.13.x autorun --config=lighthouserc.json
