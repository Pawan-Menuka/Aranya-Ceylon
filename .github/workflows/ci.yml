name: CI

on:
  push:
    branches: [main, Develop]
  pull_request:
    branches: [main, Develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @aranya/shared build

      - name: Generate Prisma client
        run: pnpm --filter @aranya/backend exec prisma generate

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Validate Prisma schema
        run: pnpm --filter @aranya/backend exec prisma validate

      - name: Security audit
        # Report-only: surfaces advisories without failing CI. Many remaining
        # high/critical findings are transitive deps inside Prisma's own tooling
        # (@prisma/dev, @prisma/config) that we can't patch directly.
        run: pnpm audit --audit-level=high --prod || true

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aranya-next/package-lock.json

      - name: Install dependencies
        working-directory: aranya-next
        run: npm ci

      - name: Type check
        working-directory: aranya-next
        run: npm run typecheck

      - name: Lint
        working-directory: aranya-next
        run: npm run lint

      - name: Build
        working-directory: aranya-next
        run: npm run build
