name: CI

on:
  push:
    branches: [main, Develop]
  pull_request:
    branches: [main, Develop]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @aranya/shared build

      - name: Generate Prisma client
        run: pnpm --filter @aranya/backend exec prisma generate

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build frontend
        run: pnpm --filter @aranya/frontend build

      - name: Validate Prisma schema
        run: pnpm --filter @aranya/backend exec prisma validate

      - name: Security audit
        run: pnpm audit --audit-level=high
