name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []

    env:
      DATABASE_URL:      ${{ secrets.DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @aranya/shared build

      - name: Generate Prisma client
        run: pnpm --filter @aranya/backend exec prisma generate

      - name: Run database migrations
        run: pnpm --filter @aranya/backend exec prisma migrate deploy
        # migrate deploy applies existing migration files only —
        # never creates new ones. Safe to run in CI.

      - name: Build backend
        run: pnpm build:backend

      # Railway auto-deploys from main branch when connected via GitHub.
      # The build above just verifies the TypeScript compiles cleanly.
      # Actual Railway deploy is triggered by the git push automatically.
