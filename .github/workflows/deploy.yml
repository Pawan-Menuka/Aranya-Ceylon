name: Deploy

on:
  push:
    branches: [main]

jobs:
  # Production is only touched after the full CI workflow (types, lint, unit
  # and PostgreSQL integration tests, builds, browser checkout test) passes on
  # this exact commit.
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # prisma.config.ts reads DIRECT_URL (not DIRECT_DATABASE_URL) for the
      # non-pooled migration connection — keep this key name in sync with that.
      DIRECT_URL: ${{ secrets.DIRECT_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      # Prisma's own message for a bad connection string (P1013) never says which
      # one, and this step has failed that way before. Check the shape here, fail
      # fast, and never print the value.
      - name: Check database connection strings
        run: |
          bad=0
          for name in DATABASE_URL DIRECT_URL; do
            value="${!name}"
            if [[ ! "$value" =~ ^postgres(ql)?:// ]]; then
              echo "::error::$name is empty or does not start with postgresql:// (DIRECT_URL comes from the DIRECT_DATABASE_URL secret). Re-save the secret as the bare connection string: no quotes, no spaces, no 'psql' prefix."
              bad=1
            fi
          done
          exit "$bad"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @aranya/shared build

      - name: Generate Prisma client
        run: pnpm --filter @aranya/backend exec prisma generate

      - name: Run database migrations
        run: pnpm --filter @aranya/backend exec prisma migrate deploy
        # migrate deploy applies existing migration files only —
        # never creates new ones. Safe to run in CI.

      - name: Build backend
        run: pnpm build:backend

      # Railway auto-deploys from main branch when connected via GitHub.
      # The build above just verifies the TypeScript compiles cleanly.
      # Actual Railway deploy is triggered by the git push automatically.
