<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aranya Ceylon — Mobile Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="aranya.css" />
<style>
  html, body { margin: 0; background: #E7E0D4; }
  .page { min-height: 100vh; padding: 54px 28px 80px; }
  .intro { max-width: 760px; margin: 0 auto 48px; text-align: center; }
  .intro .eyebrow { color: var(--accent); justify-content: center; display: flex; gap: 11px; align-items: center; margin-bottom: 14px; }
  .intro h1 { font-family: var(--font-display); font-weight: 600; color: var(--brand); font-size: clamp(34px, 5vw, 56px); line-height: 1.02; margin: 0; }
  .intro p { font-family: var(--font-read); font-size: 17px; line-height: 1.65; color: var(--muted); margin: 16px auto 0; max-width: 580px; }

  .hero-device { display: flex; justify-content: center; margin-bottom: 22px; }
  .cap { text-align: center; font-family: var(--font-ui); font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 26px; }
  .cap b { color: var(--brand); font-weight: 700; }

  .rail-wrap { max-width: 1320px; margin: 70px auto 0; }
  .rail-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 0 6px 22px; }
  .rail-head h2 { font-family: var(--font-display); font-weight: 600; color: var(--brand); font-size: clamp(26px, 3vw, 38px); margin: 0; line-height: 1.04; }
  .rail-head span { font-family: var(--font-ui); font-size: 13.5px; color: var(--muted); }
  .rail { display: flex; gap: 30px; overflow-x: auto; padding: 8px 6px 28px; scroll-snap-type: x mandatory; }
  .rail::-webkit-scrollbar { height: 10px; }
  .rail::-webkit-scrollbar-thumb { background: rgba(26,26,26,.16); border-radius: 999px; }
  .frame { flex: 0 0 auto; scroll-snap-align: center; }
  .frame .label { text-align: center; font-family: var(--font-ui); margin-top: 16px; }
  .frame .label .step { display: inline-block; font-size: 10.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #fff; background: var(--brand); border-radius: 999px; padding: 4px 11px; }
  .frame .label .name { display: block; font-size: 15px; font-weight: 700; color: var(--ink); margin-top: 9px; }
  .frame .label .desc { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; }

  .noscroll::-webkit-scrollbar { display: none; }
  .noscroll { scrollbar-width: none; }
</style>
</head>
<body>
<div class="page">
  <div class="intro">
    <div class="eyebrow"><span style="width:22px;height:1px;background:var(--accent)"></span>Mobile · iOS<span style="width:22px;height:1px;background:var(--accent)"></span></div>
    <h1>The shopping flow, on mobile.</h1>
    <p>The full purchase journey — browse, choose, cart, checkout, confirm — as one tappable prototype. The first device is live: shop the harvest, add to your cart, and place an order. Below, every screen of the flow at a glance.</p>
  </div>
  <div id="root"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="spice-data.js"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="support-common.jsx"></script>
<script type="text/babel" src="home-common.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="mobile.jsx"></script>
<script type="text/babel" src="mobile-flow.jsx"></script>
<script type="text/babel" src="mobile-flow-shop.jsx"></script>
<script type="text/babel" src="mobile-home.jsx"></script>
<script type="text/babel" src="mobile-flow-buy.jsx"></script>
<script type="text/babel">
const { useMemo } = React;
const S = window.SPICES;
const byName = (n) => S.find((x) => x.name === n);

/* seed helpers — fresh array each call so instances stay independent */
const seedCart = () => [
  { id: "Ceylon Cinnamon|100g|Whole", spice: byName("Ceylon Cinnamon"), weight: "100g", form: "Whole", qty: 2 },
  { id: "Green Cardamom|50g|Whole",   spice: byName("Green Cardamom"),   weight: "50g",  form: "Whole", qty: 1 },
  { id: "Ground Turmeric|250g|Ground", spice: byName("Ground Turmeric"), weight: "250g", form: "Ground", qty: 1 },
];
const seedOrder = () => ({
  number: "AC-481027", email: "maya@example.com", market: "intl", total: 71.7,
  items: [
    { name: "Ceylon Cinnamon", weight: "100g", form: "Whole", qty: 2 },
    { name: "Green Cardamom", weight: "50g", form: "Whole", qty: 1 },
    { name: "Ground Turmeric", weight: "250g", form: "Ground", qty: 1 },
  ],
});

const SHOWCASE = [
  { step: "01", name: "Home", desc: "Hero + featured harvest", props: { initialScreen: "home" } },
  { step: "02", name: "Shop", desc: "Filterable 2-up catalog", props: { initialScreen: "catalog" } },
  { step: "03", name: "Product", desc: "Weight, qty, add to cart", props: { initialScreen: "product", initialSpice: byName("Green Cardamom") } },
  { step: "04", name: "Cart", desc: "Line items + free-ship meter", props: { initialScreen: "cart", initialCartSeed: seedCart } },
  { step: "05", name: "Checkout", desc: "Contact, ship, pay", props: { initialScreen: "checkout", initialCartSeed: seedCart } },
  { step: "06", name: "Confirmed", desc: "Thank-you + order summary", props: { initialScreen: "confirm", initialOrder: seedOrder } },
];

function App() {
  return (
    <React.Fragment>
      {/* interactive hero device */}
      <div className="hero-device">
        <IOSDevice dark>
          <MobileFlow initialScreen="home" />
        </IOSDevice>
      </div>
      <div className="cap"><b>Live prototype</b> — tap “Shop the Harvest”, open a spice, add to cart, and check out. Switch market (USD / LKR) from the menu.</div>

      {/* showcase rail */}
      <div className="rail-wrap">
        <div className="rail-head">
          <h2>Every screen in the flow</h2>
          <span>Scroll horizontally · each device is independently interactive</span>
        </div>
        <div className="rail noscroll">
          {SHOWCASE.map((s) => (
            <div className="frame" key={s.step}>
              <IOSDevice dark>
                <MobileFlow {...s.props} />
              </IOSDevice>
              <div className="label">
                <span className="step">{s.step}</span>
                <span className="name">{s.name}</span>
                <span className="desc">{s.desc}</span>
              </div>
            </div>
          ))}
        </div>
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
