<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aranya Ceylon — Navbar (locked)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="aranya.css" />
<style>
  html, body { margin: 0; background: var(--bg); }
  .page { padding: 150px 40px 120px; max-width: 1280px; margin: 0 auto; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
  .mkt { position: fixed; right: 22px; bottom: 22px; z-index: 90; background: rgba(20,18,16,.88); backdrop-filter: blur(12px);
    border: 1px solid rgba(253,250,245,.16); border-radius: 13px; padding: 8px; display: flex; gap: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
  .mkt b { font-family: var(--font-ui); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgba(253,250,245,.5); display: flex; align-items: center; padding: 0 10px; }
  .mkt button { background: rgba(253,250,245,.06); color: rgba(253,250,245,.85); border: 1px solid rgba(253,250,245,.14); border-radius: 9px; padding: 9px 15px; cursor: pointer; font-family: var(--font-ui); font-size: 13px; font-weight: 700; }
  .mkt button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .mkt button.on.local { background: var(--brand); border-color: var(--brand); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="spice-data.js"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="cards.jsx"></script>
<script type="text/babel" src="navbar.jsx"></script>
<script type="text/babel">
const { useState } = React;
function App() {
  const [market, setMarket] = useState("intl");
  const all = window.SPICES;
  return (
    <div className="aranya">
      <AranyaNavbar market={market} heroMode={false} />
      <div className="page">
        <div className="eyebrow" style={{ color: "var(--accent)", marginBottom: 10 }}>Shop · All Spices</div>
        <h1 className="disp" style={{ fontSize: 46, color: "var(--brand)", margin: "0 0 6px", lineHeight: 1.04 }}>The 2026 Harvest</h1>
        <p style={{ fontFamily: "var(--font-ui)", fontSize: 15, color: "var(--muted)", margin: "0 0 36px", maxWidth: 560, lineHeight: 1.6 }}>
          Solid forest navbar on cream — the canonical resting state for every page beyond the hero. Scroll down: it tucks away. Scroll up: it returns. Toggle the market to see the currency adapt.
        </p>
        <div className="grid">
          {all.map((s) => <CardA key={s.name} spice={s} market={market} />)}
          {all.map((s) => <CardA key={s.name + "2"} spice={s} market={market} />)}
        </div>
      </div>
      <div className="mkt">
        <b>Market</b>
        <button className={market === "intl" ? "on" : ""} onClick={() => setMarket("intl")}>International · USD</button>
        <button className={"local " + (market === "local" ? "on" : "")} onClick={() => setMarket("local")}>Sri Lanka · LKR</button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
