<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aranya Ceylon — Account & Order Tracking</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="aranya.css" />
<style>
  html, body { margin: 0; background: var(--bg); }
  @keyframes acPulse  { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.6); opacity: 0; } }
  @keyframes acPulse2 { 0% { box-shadow: 0 0 0 0 rgba(230,184,96,.55); } 100% { box-shadow: 0 0 0 7px rgba(230,184,96,0); } }
  @keyframes acToastIn { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .ac-toast { animation: acToastIn .3s cubic-bezier(.4,0,.2,1); }
  @media (max-width: 920px) {
    .ac-shell { flex-direction: column !important; }
    .ac-shell aside { position: static !important; flex: 1 1 auto !important; width: 100% !important; top: auto !important; }
    .ac-gate { grid-template-columns: 1fr !important; gap: 36px !important; }
    .ac-detail-cols { grid-template-columns: 1fr !important; }
  }
  @media (max-width: 620px) {
    .ac-shell, .ac-gate, .ac-main { padding-left: 0 !important; padding-right: 0 !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="spice-data.js"></script>
<script src="catalog-data.js"></script>
<script src="api.js"></script>
<script src="cart-store.js"></script>
<script src="account-data.js"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="cards.jsx"></script>
<script type="text/babel" src="navbar.jsx"></script>
<script type="text/babel" src="home-common.jsx"></script>
<script type="text/babel" src="home-footer.jsx"></script>
<script type="text/babel" src="cart-ui.jsx"></script>
<script type="text/babel" src="account-tracking.jsx"></script>
<script type="text/babel" src="account.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
const { useState: aUse, useEffect: aEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "orderStatus": "out_for_delivery",
  "navStyle": "sidebar"
}/*EDITMODE-END*/;

function ReorderToast({ order, market, onClose, onCart }) {
  aEffect(() => { const t = setTimeout(onClose, 4200); return () => clearTimeout(t); }, []);
  if (!order) return null;
  return (
    <div className="ac-toast" style={{ position: "fixed", left: "50%", bottom: 28, transform: "translateX(-50%)", zIndex: 110,
      background: "var(--ink)", color: "#FDFAF5", borderRadius: 12, padding: "14px 18px", display: "flex", alignItems: "center", gap: 16,
      boxShadow: "0 18px 50px rgba(0,0,0,.3)", maxWidth: "calc(100vw - 32px)" }}>
      <span style={{ width: 32, height: 32, borderRadius: 999, background: "var(--brand)", display: "grid", placeItems: "center", flex: "0 0 auto" }}>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5" /></svg>
      </span>
      <span style={{ fontFamily: "var(--font-ui)", fontSize: 14, fontWeight: 600 }}>{order.items.reduce((n, it) => n + it.qty, 0)} jars from {order.id} added to your basket</span>
      <button onClick={onCart} style={{ background: "#E6B860", color: "#1A1A1A", border: 0, borderRadius: 8, padding: "9px 14px", cursor: "pointer", fontFamily: "var(--font-ui)", fontSize: 13, fontWeight: 700, whiteSpace: "nowrap" }}>View basket</button>
    </div>
  );
}

function AccountApp() {
  const cart = useCart();
  const [market, setMarket] = useMarket();
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [cartOpen, setCartOpen] = aUse(false);
  const [toast, setToast] = aUse(null);
  // Real auth state: null = loading, false = signed out, object = signed-in user
  const [liveUser, setLiveUser] = aUse(null);

  // Check existing session on mount
  aEffect(() => {
    if (!window.AranyaAPI || !window.AranyaAPI.isAuthed()) { setLiveUser(false); return; }
    window.AranyaAPI.me()
      .then((r) => setLiveUser(r.user || r))
      .catch(() => setLiveUser(false));
  }, []);

  // Redirect to gate when JWT expires mid-session
  aEffect(() => {
    const h = () => setLiveUser(false);
    window.addEventListener("aranya:auth-expired", h);
    return () => window.removeEventListener("aranya:auth-expired", h);
  }, []);

  const handleSignIn = (user) => setLiveUser(user);

  const handleSignOut = async () => {
    if (window.AranyaAPI) await window.AranyaAPI.logout().catch(() => {});
    setLiveUser(false);
  };

  const signedIn = !!liveUser;
  const authLoading = liveUser === null;

  return (
    <div className="aranya" style={{ minHeight: "100vh", background: "var(--bg)" }}>
      <AranyaNavbar market={market} heroMode={false} cartCount={cart.count()}
        onCartClick={() => setCartOpen(true)}
        onAccountClick={() => { if (signedIn) window.scrollTo({ top: 0, behavior: "smooth" }); }} />

      <div style={{ height: 106 }} />

      {authLoading ? (
        <div style={{ minHeight: "50vh", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <div style={{ fontFamily: "var(--font-ui)", fontSize: 15, color: "var(--muted)", fontWeight: 600 }}>Loading…</div>
        </div>
      ) : signedIn ? (
        <AccountShell market={market} liveUser={liveUser} statusOverride={t.orderStatus} navStyle={t.navStyle}
          onSignOut={handleSignOut}
          onReorderToast={(o) => setToast(o)} />
      ) : (
        <SignedOutGate market={market} onSignIn={handleSignIn} />
      )}

      <Footer market={market} setMarket={setMarket} />

      <CartDrawer open={cartOpen} onClose={() => setCartOpen(false)} />
      {toast && <ReorderToast order={toast} market={market} onClose={() => setToast(null)} onCart={() => { setToast(null); setCartOpen(true); }} />}

      <TweaksPanel title="Tweaks">
        <TweakSection label="Market" />
        <TweakRadio label="Currency" value={market} options={[{ value: "intl", label: "USD · Intl" }, { value: "local", label: "LKR · Local" }]} onChange={(v) => setMarket(v)} />
        <TweakSection label="Order tracking" />
        <TweakSelect label="Active shipment status" value={t.orderStatus}
          options={[{ value: "processing", label: "Processing" }, { value: "in_transit", label: "In transit" }, { value: "out_for_delivery", label: "Out for delivery" }, { value: "delivered", label: "Delivered" }]}
          onChange={(v) => setTweak("orderStatus", v)} />
        <TweakSection label="Layout" />
        <TweakRadio label="Navigation" value={t.navStyle} options={[{ value: "sidebar", label: "Sidebar" }, { value: "tabs", label: "Top tabs" }]} onChange={(v) => setTweak("navStyle", v)} />
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<AccountApp />);
</script>
</body>
</html>
