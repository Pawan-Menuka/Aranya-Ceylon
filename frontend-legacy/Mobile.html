<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aranya Ceylon — Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="aranya.css" />
<style>
  html, body { margin: 0; background: #E7E0D4; }
  .stage { min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 40px; padding: 48px 24px; flex-wrap: wrap; }
  .cap { position: absolute; top: 16px; left: 0; right: 0; text-align: center; font-family: var(--font-ui); font-size: 13px; color: var(--muted); }
  .noscroll::-webkit-scrollbar { display: none; }
  .noscroll { scrollbar-width: none; }
  @keyframes mDot { 0%,100% { transform: translate(-50%,0); opacity: 1; } 50% { transform: translate(-50%,9px); opacity: .4; } }
  .m-dot { animation: mDot 2s ease-in-out infinite; }
</style>
</head>
<body>
<div class="stage" id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="spice-data.js"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="cards.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="mobile.jsx"></script>
<script type="text/babel">
const { useState, useRef } = React;
const HERO_IMG = "assets/hero-spices.png";

function MobileHome({ startDrawer = false }) {
  const [market, setMarket] = useState("intl");
  const [drawer, setDrawer] = useState(startDrawer);
  const [scrolled, setScrolled] = useState(false);
  const scroller = useRef(null);
  const onScroll = () => { if (scroller.current) setScrolled(scroller.current.scrollTop > 340); };

  const all = window.SPICES;
  const featured = [all[0], all[5], all[4]];

  return (
    <div style={{ position: "relative", height: "100%", overflow: "hidden", background: "var(--bg)" }}>
      <div ref={scroller} onScroll={onScroll} className="noscroll" style={{ position: "absolute", inset: 0, overflowY: "auto", WebkitOverflowScrolling: "touch" }}>
        <MobileNav market={market} heroMode={true} scrolled={scrolled} onMenu={() => setDrawer(true)} />

        {/* HERO */}
        <div style={{ position: "relative", height: 500, marginTop: -104, background: "#1A1A1A", overflow: "hidden" }}>
          <div style={{ position: "absolute", inset: 0, backgroundImage: `url(${HERO_IMG})`, backgroundSize: "cover", backgroundPosition: "center" }} />
          <div style={{ position: "absolute", inset: 0, background: "linear-gradient(180deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,.1) 30%, rgba(0,0,0,.15) 65%, rgba(26,26,26,.9) 100%)" }} />
          <div style={{ position: "absolute", left: 0, right: 0, bottom: 92, display: "flex", flexDirection: "column", alignItems: "center" }}>
            <div style={{ width: 34, height: 1.5, background: "var(--accent)", marginBottom: 16 }} />
            <div className="disp" style={{ fontSize: 46, fontWeight: 600, color: "#FDFAF5", letterSpacing: ".1em", lineHeight: 1 }}>ARANYA</div>
            <div className="disp" style={{ fontStyle: "italic", fontSize: 16, color: "var(--accent)", letterSpacing: ".26em", marginTop: 10 }}>CEYLON</div>
            <div style={{ width: 34, height: 1.5, background: "var(--accent)", marginTop: 16 }} />
          </div>
          <div style={{ position: "absolute", left: 0, right: 0, bottom: 26, display: "flex", flexDirection: "column", alignItems: "center", gap: 7 }}>
            <span style={{ fontFamily: "var(--font-ui)", fontSize: 9.5, letterSpacing: ".22em", textTransform: "uppercase", color: "rgba(253,250,245,.55)", fontWeight: 500 }}>Scroll</span>
            <div style={{ width: 21, height: 32, borderRadius: 11, border: "1.5px solid rgba(253,250,245,.45)", position: "relative" }}>
              <span className="m-dot" style={{ position: "absolute", left: "50%", top: 6, width: 3.5, height: 3.5, borderRadius: 9, background: "rgba(253,250,245,.8)" }} />
            </div>
          </div>
        </div>

        {/* FEATURED — horizontal carousel of Card B */}
        <section style={{ background: "var(--bg)", padding: "30px 0 34px" }}>
          <div style={{ padding: "0 18px", marginBottom: 16 }}>
            <div className="eyebrow" style={{ color: "var(--accent)", marginBottom: 7 }}>Editorial · Hand-picked</div>
            <h2 className="disp" style={{ fontSize: 30, color: "var(--brand)", margin: 0, lineHeight: 1.05 }}>The Featured Harvest</h2>
          </div>
          <div className="noscroll" style={{ display: "flex", gap: 14, overflowX: "auto", padding: "4px 18px 6px", scrollSnapType: "x mandatory" }}>
            {featured.map((s) => <div key={s.name} style={{ flex: "0 0 270px", scrollSnapAlign: "start" }}><CardB spice={s} market={market} /></div>)}
          </div>
        </section>

        {/* CATALOG — 2-up Card C mobile */}
        <section style={{ background: "var(--surface)", padding: "30px 0 40px", borderTop: "1px solid var(--line)" }}>
          <div style={{ padding: "0 18px", marginBottom: 14 }}>
            <div className="eyebrow" style={{ color: "var(--accent)", marginBottom: 7 }}>Shop · All Spices</div>
            <h2 className="disp" style={{ fontSize: 30, color: "var(--brand)", margin: 0, lineHeight: 1.05 }}>The 2026 Collection</h2>
          </div>
          <div className="noscroll" style={{ display: "flex", gap: 8, overflowX: "auto", padding: "0 18px 16px" }}>
            {["All Spices", "Whole", "Ground", "Bestsellers", "GI Certified"].map((c, i) => (
              <button key={c} style={{ flex: "0 0 auto", fontFamily: "var(--font-ui)", fontSize: 13, fontWeight: 600, padding: "8px 15px", borderRadius: 999, cursor: "pointer",
                border: i === 0 ? "1px solid var(--brand)" : "1px solid var(--line)", background: i === 0 ? "var(--brand)" : "#fff", color: i === 0 ? "#fff" : "var(--muted)" }}>{c}</button>
            ))}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, padding: "0 18px" }}>
            {all.map((s) => <CardCMobile key={s.name} spice={s} market={market} />)}
          </div>
        </section>

        <div style={{ background: "var(--brand)", color: "rgba(253,250,245,.8)", textAlign: "center", padding: "26px 18px 40px", fontFamily: "var(--font-display)", fontSize: 20 }}>
          Aranya Ceylon · Forest Sourced
        </div>
      </div>

      <MobileDrawer open={drawer} onClose={() => setDrawer(false)} market={market} setMarket={setMarket} />
    </div>
  );
}

function App() {
  return (
    <React.Fragment>
      <div style={{ position: "relative" }}>
        <div className="cap">Interactive — scroll, tap ☰ to open the menu</div>
        <IOSDevice dark>
          <MobileHome />
        </IOSDevice>
      </div>
      <div style={{ position: "relative" }}>
        <div className="cap">Menu drawer + market switcher</div>
        <IOSDevice dark>
          <MobileHome startDrawer={true} />
        </IOSDevice>
      </div>
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
