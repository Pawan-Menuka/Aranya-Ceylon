<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aranya Ceylon — Shipping &amp; Returns</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="aranya.css" />
<style>
  html, body { margin: 0; background: var(--bg); }
  body { overflow-x: hidden; }

  .mkt { position: fixed; right: 22px; bottom: 22px; z-index: 90; background: rgba(20,18,16,.88); backdrop-filter: blur(12px);
    border: 1px solid rgba(253,250,245,.16); border-radius: 13px; padding: 8px; display: flex; gap: 6px; box-shadow: 0 12px 40px rgba(0,0,0,.4); }
  .mkt b { font-family: var(--font-ui); font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: rgba(253,250,245,.5); display: flex; align-items: center; padding: 0 10px; }
  .mkt button { background: rgba(253,250,245,.06); color: rgba(253,250,245,.85); border: 1px solid rgba(253,250,245,.14); border-radius: 9px; padding: 9px 15px; cursor: pointer; font-family: var(--font-ui); font-size: 13px; font-weight: 700; }
  .mkt button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .mkt button.on.local { background: var(--brand); border-color: var(--brand); }

  @media (max-width: 860px) {
    .ship-rates { grid-template-columns: 1fr !important; }
    .ship-track { grid-template-columns: 1fr 1fr !important; row-gap: 36px !important; }
    .ship-returns { grid-template-columns: 1fr !important; }
    .ship-steps { grid-template-columns: 1fr !important; row-gap: 26px !important; }
  }
  @media (max-width: 520px) {
    .ship-track { grid-template-columns: 1fr !important; }
    .home-section-pad { padding-left: 22px !important; padding-right: 22px !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="image-slot.js"></script>
<script src="spice-data.js"></script>
<script src="cart-store.js"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="navbar.jsx"></script>
<script type="text/babel" src="home-common.jsx"></script>
<script type="text/babel" src="home-footer.jsx"></script>
<script type="text/babel" src="cart-ui.jsx"></script>
<script type="text/babel" src="support-common.jsx"></script>
<script type="text/babel" src="shipping.jsx"></script>
<script type="text/babel">
const { useState: useShState, useEffect: useShEffect } = React;
function ShippingApp() {
  const cart = useCart();
  const [market, setMarket] = useMarket();
  const [cartOpen, setCartOpen] = useShState(false);
  const [signInOpen, setSignInOpen] = useShState(false);
  useShEffect(() => { window.__openCart = () => setCartOpen(true); return () => { delete window.__openCart; }; }, []);
  return (
    <div className="aranya">
      <AranyaNavbar market={market} heroMode={true} cartCount={cart.count()} onCartClick={() => setCartOpen(true)} onAccountClick={() => setSignInOpen(true)} />
      <SupportHeader active="Shipping & Returns" eyebrow="Support · Shipping & Returns"
        title={<>Shipping &amp;<br />returns.</>}
        lead="Rates, delivery times and our fair returns policy — for orders within Sri Lanka and to 40+ countries worldwide." />
      <ShipBody market={market} />
      <SupportCTA market={market} />
      <Footer market={market} setMarket={setMarket} />

      <CartDrawer open={cartOpen} onClose={() => setCartOpen(false)} />
      <SignInModal open={signInOpen} onClose={() => setSignInOpen(false)} />

      <div className="mkt">
        <b>Market</b>
        <button className={market === "intl" ? "on" : ""} onClick={() => setMarket("intl")}>USD · Intl</button>
        <button className={"local " + (market === "local" ? "on" : "")} onClick={() => setMarket("local")}>LKR · Local</button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<ShippingApp />);
</script>
</body>
</html>
